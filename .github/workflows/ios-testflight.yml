# PadelRun iPhone-App: signierter Bau und Upload zu App Store Connect / TestFlight.
# Start: GitHub → Actions → „iOS TestFlight“ → Run workflow.
# Benötigte Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (Inhalt der .p8-Datei)
name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets prüfen
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            raw="${!v}"; clean="$(printf '%s' "$raw" | tr -d '[:space:]')"
            echo "$v: Länge ${#raw}, ohne Leerzeichen ${#clean}"
            echo "$v=$clean" >> "$GITHUB_ENV"
          done
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do [ -n "${!v}" ] || { echo "::error::Secret $v fehlt"; exit 1; }; done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || { echo "::error::Secret ASC_KEY_P8 fehlt"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pakete installieren
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          sudo gem install xcodeproj --no-document

      - name: Web-App bauen
        run: npm run build

      - name: iOS-Projekt erzeugen und ergänzen
        run: |
          npx cap add ios
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Damit du Siegerfotos und ein Profilbild hochladen kannst.'" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Damit du direkt nach dem Match ein Siegerfoto aufnehmen kannst.'" "$P"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          ruby scripts/ios-projekt.rb
          npx cap sync ios

      - name: App-Store-Connect-Schlüssel ablegen
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Schlüssel prüfen (ohne Inhalt anzuzeigen)
        run: |
          K="$RUNNER_TEMP/asc/AuthKey.p8"
          echo "Zeilen: $(wc -l < "$K" | tr -d ' ')"
          head -1 "$K" | grep -q 'BEGIN PRIVATE KEY' && echo "Anfang ok" || echo "::warning::Erste Zeile ist nicht BEGIN PRIVATE KEY"
          grep -q 'END PRIVATE KEY' "$K" && echo "Ende ok" || echo "::warning::END PRIVATE KEY fehlt"
          grep -q $'\r' "$K" && echo "::warning::Windows-Zeilenenden" || true
          openssl pkey -in "$K" -noout 2>/dev/null && echo "Schlüssel lesbar" || echo "::warning::Schlüssel nicht lesbar"
          cat > "$RUNNER_TEMP/jwt.rb" <<'RB'
          require 'openssl'; require 'base64'; require 'json'; require 'net/http'
          k = OpenSSL::PKey.read(File.read(ARGV[0]))
          b = ->(x){ Base64.urlsafe_encode64(x, padding: false) }
          h = b.(JSON.dump({alg:'ES256', kid:ENV['ASC_KEY_ID'], typ:'JWT'}))
          t = Time.now.to_i
          pl = b.(JSON.dump({iss:ENV['ASC_ISSUER_ID'], iat:t, exp:t+600, aud:'appstoreconnect-v1'}))
          der = k.sign(OpenSSL::Digest::SHA256.new, "#{h}.#{pl}")
          a = OpenSSL::ASN1.decode(der).value.map{|i| i.value.to_s(2).rjust(32, "\0")[-32,32] }.join
          jwt = "#{h}.#{pl}.#{b.(a)}"
          u = URI('https://api.appstoreconnect.apple.com/v1/apps?fields[apps]=bundleId&limit=5')
          r = Net::HTTP.start(u.host, 443, use_ssl: true){|x| x.get(u.request_uri, 'Authorization' => "Bearer #{jwt}") }
          puts "API-Test: HTTP #{r.code}"
          puts r.body[0,600] if r.code != '200'
          puts JSON.parse(r.body)['data'].map{|d| d['attributes']['bundleId']}.inspect if r.code == '200'
          RB
          ruby "$RUNNER_TEMP/jwt.rb" "$K" || true

      - name: Archiv bauen (signiert)
        run: |
          cd ios/App
          if [ -f App.xcworkspace/contents.xcworkspacedata ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PadelRun.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 80
          exit ${PIPESTATUS[0]}

      - name: Zu App Store Connect hochladen
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PadelRun.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 60
          exit ${PIPESTATUS[0]}

      - name: Schlüssel löschen
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
