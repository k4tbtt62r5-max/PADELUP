<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>PadelRun laden</title><link rel="icon" href="/assets/icon.png">
<style>
:root{--bg:#f6f5f1;--tx:#0e1b3d;--mu:#5b6688;--bl:#2f5bff;--lime:#c8f31d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;display:flex;flex-direction:column;align-items:center;padding:48px 20px 32px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:26px;letter-spacing:-.4px}.brand img{width:52px;border-radius:13px}.brand i{color:var(--bl)}
h1{font-size:36px;line-height:1.1;letter-spacing:-.03em;text-align:center;margin:36px 0 10px;max-width:12em}
p.l{color:var(--mu);text-align:center;margin:0 0 30px;max-width:22em}
.btn{display:block;width:100%;max-width:360px;text-align:center;text-decoration:none;font-weight:800;font-size:19px;padding:18px 22px;border-radius:999px;margin-bottom:14px}
.main{background:var(--tx);color:#fff}.sec{background:#fff;color:var(--tx);border:2px solid #e2e0d8}
.soon{background:#e9e7e0;color:var(--mu);cursor:default}
small{color:var(--mu);margin-top:18px;text-align:center}
img.ph{width:230px;border-radius:30px;margin-top:30px;box-shadow:0 24px 50px -20px rgba(14,27,61,.35);border:8px solid #0e1b3d}
</style></head><body>
<div class=brand><img src="/assets/icon.png" alt=""><span>Padel<i>Run</i></span></div>
<h1>Die Rangliste für deine Padel-Halle.</h1>
<p class=l>Spielen. Eintragen. Aufsteigen.</p>
<a id=ios class="btn main" href="#">Im App Store laden</a>
<a id=web class="btn sec" href="/app/">Im Browser spielen</a>
<small id=hint></small>
<img class=ph src="/assets/rangliste.webp" alt="PadelRun Rangliste">
<script>
// Am Starttag LIVE auf true setzen – dann wird der App-Store-Knopf aktiv.
var LIVE = false;
var APPSTORE = LIVE ? "https://apps.apple.com/de/app/id6833491873" : "";
var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
var a=document.getElementById('ios'),w=document.getElementById('web'),h=document.getElementById('hint');
if(APPSTORE){a.href=APPSTORE;}else{a.textContent="Bald im App Store";a.className="btn soon";a.removeAttribute('href');}
if(!ios){ // Android & Co: Browser-Version zuerst
  w.className="btn main";a.parentNode.insertBefore(w,a);if(APPSTORE){a.className="btn sec";a.textContent="iPhone? Im App Store laden";}
  h.textContent="Android? Einfach im Browser spielen und zum Home-Bildschirm hinzufügen.";
}
</script>
</body></html>
