<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-itunes-app" content="app-id=6833491873">
<meta name="robots" content="noindex"><title>PadelRun laden</title><link rel="icon" href="/assets/icon.png">
<style>
:root{--bg:#f6f5f1;--tx:#0e1b3d;--mu:#5b6688;--bl:#2f5bff;--lime:#c8f31d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;display:flex;flex-direction:column;align-items:center;padding:44px 20px 32px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:26px;letter-spacing:-.4px}.brand img{width:52px;border-radius:13px}.brand i{color:var(--bl)}
h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;text-align:center;margin:30px 0 10px;max-width:12em}
p.l{color:var(--mu);text-align:center;margin:0 0 24px;max-width:22em}
.code{display:none;background:#fff;border:2px solid #e2e0d8;border-radius:18px;padding:14px 20px;text-align:center;margin-bottom:22px;width:100%;max-width:360px}
.code small{display:block;color:var(--mu);font-size:14px}.code b{font-size:30px;letter-spacing:4px}
.btn{display:block;width:100%;max-width:360px;text-align:center;text-decoration:none;font-weight:800;font-size:19px;padding:18px 22px;border-radius:999px;margin-bottom:14px;border:0;font-family:inherit;cursor:pointer}
.main{background:var(--tx);color:#fff}.sec{background:#fff;color:var(--tx);border:2px solid #e2e0d8}
.soon{background:#e9e7e0;color:var(--mu);cursor:default}
small.h{color:var(--mu);margin-top:12px;text-align:center;max-width:22em}
img.ph{width:220px;border-radius:30px;margin-top:28px;box-shadow:0 24px 50px -20px rgba(14,27,61,.35);border:8px solid #0e1b3d}
</style></head><body>
<div class=brand><img src="/assets/icon.png" alt=""><span>Padel<i>Run</i></span></div>
<h1 id=t>Die Rangliste für deine Padel-Halle.</h1>
<p class=l id=s>Spielen. Eintragen. Aufsteigen.</p>
<div class=code id=cd><small>Code deiner Halle</small><b id=cv></b></div>
<a id=ios class="btn main" href="#">Im App Store laden</a>
<a id=web class="btn sec" href="/app/">Im Browser spielen</a>
<small class=h id=hint></small>
<img class=ph src="/assets/rangliste.webp" alt="PadelRun Rangliste">
<script>
// Am Starttag LIVE auf true setzen – dann wird der App-Store-Knopf aktiv.
var LIVE = false;
var APPSTORE = LIVE ? "https://apps.apple.com/de/app/id6833491873" : "";
var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
var a=document.getElementById('ios'),w=document.getElementById('web'),h=document.getElementById('hint');
var m=(location.hash||'').match(/join=([^&]+)/)||(location.search||'').match(/[?&]c=([^&]+)/);
var code=m?decodeURIComponent(m[1]).toUpperCase().replace(/[^A-Z0-9]/g,''):'';
if(code){
  document.getElementById('t').textContent='Du wurdest in eine Halle eingeladen.';
  document.getElementById('s').textContent='Lade PadelRun und tritt mit diesem Code bei:';
  document.getElementById('cd').style.display='block';document.getElementById('cv').textContent=code;
  w.href='/app/#join='+encodeURIComponent(code)+'&web=1';w.textContent='Im Browser beitreten';
  a.addEventListener('click',function(){try{navigator.clipboard.writeText(code)}catch(e){}});
}
if(APPSTORE){a.href=APPSTORE;if(code)h.textContent='Tipp: Der Code wird beim Tippen kopiert. In der App unter „Halle beitreten“ einfügen.';}
else{a.textContent=(Date.now()<Date.UTC(2026,10,16,5,0)?"Ab Montag im App Store":"Bald im App Store");a.className="btn soon";a.removeAttribute('href');}
if(!ios||!APPSTORE){ // Android & Co oder vor dem Start: Browser zuerst
  w.className="btn main";a.parentNode.insertBefore(w,a);
  if(APPSTORE){a.className="btn sec";a.textContent="iPhone? Im App Store laden";}
  if(!ios)h.textContent="Android? Einfach im Browser spielen und zum Home-Bildschirm hinzufügen.";
}
</script>
</body></html>
